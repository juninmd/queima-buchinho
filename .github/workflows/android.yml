name: Android

on:
  pull_request:
    paths:
      - 'dashboard/android/**'
      - 'dashboard/capacitor.config.ts'
      - 'dashboard/src/lib/native.ts'
      - '.github/workflows/android.yml'
  push:
    branches: [main, master]
    paths:
      - 'dashboard/android/**'
      - 'dashboard/capacitor.config.ts'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: bun install --frozen-lockfile
      - name: Build web + sync Capacitor
        run: bun run native:sync
      # Sem google-services.json o APK compila, só não recebe push (o arquivo é segredo, fora do git).
      - name: google-services.json (opcional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: test -z "$GOOGLE_SERVICES_JSON" || echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
      - run: ./gradlew assembleDebug
        working-directory: dashboard/android
      - uses: actions/upload-artifact@v4
        with:
          name: queima-buchinho-debug-apk
          path: dashboard/android/app/build/outputs/apk/debug/app-debug.apk
