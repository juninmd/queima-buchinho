apiVersion: batch/v1
kind: Job
metadata:
  name: queima-buchinho-report-now
  namespace: queima-buchinho
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
      - name: ghcr-pull-secret
      containers:
      - name: report
        image: ghcr.io/juninmd/queima-buchinho:latest
        imagePullPolicy: Always
        command: ["bun", "src/index.ts"]
        env:
        - name: BOT_MODE
          value: "reminder_daily_report"
        - name: USER_ID
          value: "94324040"
        envFrom:
        - secretRef:
            name: queima-buchinho-secret
        resources:
          requests:
            cpu: "20m"
            memory: "96Mi"
          limits:
            cpu: "500m"
            memory: "400Mi"
